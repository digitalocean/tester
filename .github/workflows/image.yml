name: image

# Publishes registry.digitalocean.com/do-e2e-canaries/tester. Every push to
# main produces three tags:
#   sha-<7>        the commit, for humans and for tracing an image back
#   v0.<height>.0  height = first-parent commit count on main, so tags are
#                  monotonically ordered; this is the tag digitalocean/e2e
#                  pins in its Dockerfile FROM, because Dependabot can only
#                  bump base images whose tags it can compare (sha-* is
#                  opaque to it)
#   edge           moving pointer to the latest main build
# Pull requests only build, so the Dockerfile is exercised before merge
# without touching the registry. App Platform pulls from DOCR in the same
# account natively, so no pull secret or public visibility is needed.
#
# Requires the DOCR_E2E_CANARIES_REGISTRY_DOCKERPULLJSON repository secret:
# a Docker config.json (`doctl registry docker-config --read-write`) whose
# credential can push to the do-e2e-canaries registry.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  IMAGE: registry.digitalocean.com/do-e2e-canaries/tester

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the first-parent height below is the real one.
          fetch-depth: 0
      - name: Compute version tag
        id: version
        run: |
          height=$(git rev-list --count --first-parent HEAD)
          echo "version=v0.${height}.0" >> "$GITHUB_OUTPUT"
          echo "version tag: v0.${height}.0"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=edge,enable={{is_default_branch}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DOCR
        if: github.event_name == 'push'
        env:
          DOCKER_CONFIG_JSON: ${{ secrets.DOCR_E2E_CANARIES_REGISTRY_DOCKERPULLJSON }}
        run: |
          # The secret is a complete Docker config.json; install it as the
          # Docker client config so buildx/push authenticate with it.
          mkdir -p "$HOME/.docker"
          printf '%s' "$DOCKER_CONFIG_JSON" > "$HOME/.docker/config.json"
          chmod 600 "$HOME/.docker/config.json"
          # Fail here, with a clear message, rather than at push time.
          python3 -c 'import json,os,sys; c=json.load(open(os.path.expanduser("~/.docker/config.json"))); sys.exit(0 if "registry.digitalocean.com" in c.get("auths",{}) else "config.json has no auth for registry.digitalocean.com")'
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
