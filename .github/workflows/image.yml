name: image

# Publishes registry.digitalocean.com/do-e2e-canaries/tester. Every push to
# main produces `sha-<7>` and `edge`. Pull requests only build, so the
# Dockerfile is exercised before merge without touching the registry.
# digitalocean/e2e pins one of the `sha-*` tags in its Dockerfile's `FROM`,
# and App Platform pulls it natively from the same account, so no pull
# secret or public visibility is needed.
#
# Requires the DOCR_TOKEN repository secret: a DigitalOcean API token with
# read/write access to the do-e2e-canaries registry.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  IMAGE: registry.digitalocean.com/do-e2e-canaries/tester

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable={{is_default_branch}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install doctl
        if: github.event_name == 'push'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DOCR_TOKEN }}
      - name: Login to DOCR
        if: github.event_name == 'push'
        run: doctl registry login --expiry-seconds 1200
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
